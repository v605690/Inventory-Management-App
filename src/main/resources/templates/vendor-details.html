<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">

<head>
    <meta charset="UTF-8">

    <th:block th:replace="fragments/head :: commonHeader"/>

    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}"/>

    <title>Vendor-Details</title>
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/header :: header}"></div>
<div class="flex-grow-1" style="margin: 50px 200px 200px;">
    <br>
    <div class="container">
        <!-- Header -->
        <h1 th:text="${vendor.contactName}">Vendor Name
        </h1>
        <!--    <p>Current Vendor Primary Key: <span th:text="${vendor.id}"></span></p>-->
        <!--    <p>Actual List Size: <span th:text="${#sets.size(vendor.products)}"></span></p>-->

        <!-- 1. List Associated Products -->
        <h2>Associated Products</h2>
        <!--        <p>Debug: Product Count = <span th:text="${vendor.products != null ? vendor.products.size() : 'NULL'}"></span>-->

        <table class="table table-sm table-bordered products-grid">
            <thead>
            <tr>
                <th>Product Name</th>
                <th>Primary Barcode</th>
                <th>Categories</th>
                <th>In-Stock Quantity</th>
                <th>Vendor Price</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${vendor.products}">
                <td th:text="${product.productName}">Product Name</td>
                <td th:text="${product.primaryBarcode ?: 'N/A'}">SKU123</td>
                <td th:text="${product.categories}">Category</td>
                <td th:text="${product.inStockQuantity}"
                    th:style="${product.inStockQuantity < 0 ? 'color: red; font-weight: bold' : ''}">0
                </td>
                <td th:text="${product.getVbcp()}">Vendor Price</td>
            </tr>
            </tbody>
        </table>
        <hr>

        <!-- 2. Search & Associate Section -->
        <div class="actions">

            <div style="margin-top: 10px;">

                <!-- Search Form -->
<!--                builds url path, id is the placeholder that will replace by real value-->
                <form th:action="@{/vendors/{id}/search-products(id=${vendor.getId()})}" method="get">
                    <label>
                        <input type="text" name="keyword" placeholder="Search for a product...">
                    </label>
                    <button type="submit">Search</button>
<!--                    // define url structure, id placeholder-->
                    <a th:href="@{/vendors/{id}(id=${vendor.id})}"
                       class="btn btn-dark btn-sm rounded-0">Clear / Show All</a>
                </form>
            </div>
            <div style="margin-top: 10px;">
                <!-- Search Results (Shown only if results exist) -->
                <!--conditional attribute, look for searchResults in the model passed by the controller-->
                <div th:if="${searchResults}" class="search-results">
                    <!-- Row forces children into a 3-column grid -->
                    <div class="row row-cols-1 row-cols-md-3 g-2">

                        <!-- Loop on the column wrapper -->
                        <div class="col mb-2" th:each="p : ${searchResults}">
                        <!--builds url path, vId is the placeholder that will replace by real value-->
                            <form th:action="@{/vendors/{vId}/associate/{pId}(vId=${vendor.getId()}, pId=${p.id})}"
                                  method="post">
                                <button type="submit"
                                        class="btn btn-light border text-start w-100 p-1 shadow-sm text-truncate"
                                        style="font-size: 0.75rem; border-color: #333 !important; border-width: 1.5px !important;">
                                    <span style="color: blue;">Associate: </span>
                                    <span th:text="${p.productName} ?: 'Unknown ID: ' + ${p.id}"></span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                <!--Pagination-->
                <nav aria-label="Search navigation" th:if="${searchResults?.totalPages > 1}" class="mt-4">
                    <ul class="pagination pagination-sm justify-content-center flex-wrap">

                        <!-- Previous -->
                        <li class="page-item" th:classappend="${searchResults?.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/vendors/{id}/search-products(id=${id}, keyword=${keyword}, page=${searchResults.number - 1})}">Previous</a>
                        </li>

                        <!-- Windowed Number Loop -->
                        <th:block th:each="i : ${#numbers.sequence(0, searchResults.totalPages - 1)}">

                            <!-- Show if First, Last, or within 2 of Current -->
                            <li th:if="${i == 0 or i == searchResults.totalPages - 1 or (i >= searchResults.number - 2 and i <= searchResults.number + 2)}"
                                class="page-item" th:classappend="${searchResults.number == i} ? 'active'">
                                <a class="page-link"
                                   th:href="@{/vendors/{id}/search-products(id=${id}, keyword=${keyword}, page=${i})}"
                                   th:text="${i + 1}">1</a>
                            </li>

                            <!-- Ellipsis Logic -->
                            <li th:if="${(i == 1 and searchResults.number > 3) or (i == searchResults.totalPages - 2 and searchResults.number < searchResults.totalPages - 4)}"
                                class="page-item disabled">
                                <span class="page-link">...</span>
                            </li>

                        </th:block>

                        <!-- Next -->
                        <li class="page-item" th:classappend="${searchResults?.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/vendors/{id}/search-products(id=${id}, keyword=${keyword}, page=${searchResults.number + 1})}">Next</a>
                        </li>
                    </ul>
                </nav>
                <!--Add New Product-->
                <div class="dropdown">
                    <button class="btn-dark btn-sm rounded-0 dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Add New Product
                    </button>

                    <!-- Use dropdown-menu-end if the button is on the right side of the screen -->
                    <div class="dropdown-menu p-4" style="min-width: 350px;">
                        <form th:action="@{/vendors/{id}/new-product(id=${vendor.id})}" th:object="${product}" method="post">

                            <div class="mb-3">
                                <label class="form-label">Product Name</label>
                                <label>
                                    <input type="text" class="form-control" th:field="*{productName}" required />
                                </label>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">SKU</label>
                                <label>
                                    <input type="text" class="form-control" th:field="*{primaryBarcode}" required />
                                </label>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Quantity</label>
                                    <label>
                                        <input type="number" class="form-control" th:field="*{inStockQuantity}" required />
                                    </label>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Cost Price</label>
                                    <label>
                                        <input type="number" step="0.01" class="form-control" th:field="*{vbcp}" required />
                                    </label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <label>
                                    <input type="text" class="form-control" th:field="*{categories}" required />
                                </label>
                            </div>

                            <button type="submit" class="btn-dark btn-sm rounded-0">Create & Associate Product</button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
<div th:insert="fragments/footer :: inventory-footer"></div>
</body>
</html>
