<!DOCTYPE html>
<html class="h-full bg-white" xmlns:th="http://www.thymeleaf.org" lang="us"
      xmlns:background-color="http://www.w3.org/1999/xhtml">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com">
  <th:block th:replace="fragments/head :: commonHeader"/>
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}"/>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <title></title>
</head>
<body class="h-full">
<!--
  This example requires updating your template:

  ```
  <html class="h-full bg-white">
  <body class="h-full">
  ```
-->
<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=gray&shade=600" alt="Your Company" class="mx-auto h-10 w-auto" />
    <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900">Sign in to your account</h2>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
    <form action="#" method="POST" class="space-y-6">
      <div>
        <label for="username" class="block text-sm/6 font-medium text-gray-900">Email or username</label>
        <div class="mt-2">
          <input id="username" type="text" name="username" required autocomplete="text" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-black sm:text-sm/6" />
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label for="password" class="block text-sm/6 font-medium text-gray-900">Password</label>
          <div class="text-sm">
            <a href="#" class="font-semibold text-black hover:text-gray-900">Forgot password?</a>
          </div>
        </div>
        <div class="mt-2">
          <input id="password" type="password" name="password" required autocomplete="current-password" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-black sm:text-sm/6" />
        </div>
      </div>

      <div>
        <button type="submit" class="flex w-full justify-center rounded-md bg-blue-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs style=" background-color: #dd4b39>Sign in</button>
      </div>

      <hr class="my-4">

      <button data-mdb-button-init data-mdb-ripple-init class="flex w-full justify-center rounded-md px-3 py-1.5 text-sm/6 font-semibold text-white mt-3" style="background-color: #DB4437;"
              type="submit"><i class="fab fa-google me-2"></i> Sign in with google</button>
      <button data-mdb-button-init data-mdb-ripple-init class="flex w-full justify-center rounded-md px-3 py-1.5 text-sm/6 font-semibold text-white" style="background-color: #24292e;"
              type="submit"><i class="fab fa-github me-2"></i>Sign in with github</button>
    </form>

    <p class="mt-10 text-center text-sm/6 text-gray-500">
      Not a member?
      <a href="#" class="font-semibold text-black hover:text-gray-900">Register Here</a>
    </p>
  </div>
</div>
</body>
</html>
