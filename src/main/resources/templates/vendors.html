<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html" xmlns:margin-right="http://www.w3.org/1999/xhtml"
      xmlns:margin-top="http://www.w3.org/1999/xhtml" xmlns:margin-bottom="http://www.w3.org/1999/xhtml">
<head>

    <th:block th:replace="fragments/head :: commonHeader"/>

    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/overview.css}"/>

    <title>Vendors</title>

</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5">

    <h2 class="mb-4">Vendors Card View</h2>

<!--         style="margin-left: 20px; margin-right: 20px; padding: 10px; display: flex; align-items: center; border-radius: 5px;">-->

<!--    <div style="margin-left: 5px;">-->
    <div class="filter-section border">
        <form class="second-form" th:action="@{|/vendors/search|}" method="get">
            <label for="vendors">Search Vendor</label>
            <input
                    type="search"
                    id="vendors"
                    name="contactName"
                    th:value="${vendorContactList}"
                    placeholder="Search By Vendors…"
                    required
            />
            <button type="submit">Search</button>
            <span class="validity" aria-live="polite"></span>
            <a th:href="@{/vendors}" style="text-decoration: none;">
                <button type="button">Clear / Show All</button>
            </a>
        </form>
    </div>
    <!--Pagination-->
        <!-- 1. Pagination First -->
        <nav aria-label="Search navigation" th:if="${searchResults?.totalPages > 1}">
            <ul class="pagination pagination-sm mb-0">
                <!-- Previous -->
                <li class="page-item" th:classappend="${searchResults?.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/vendors(page=${searchResults.number > 0 ? searchResults.number - 1 : 0}, size=${size}, sort=${sortBy})}">Previous</a>
                </li>

                <!-- Number Loop -->
                <th:block th:each="i : ${#numbers.sequence(0, searchResults.totalPages - 1)}">
                    <li th:if="${i == 0 or i == searchResults.totalPages - 1 or (i >= searchResults.number - 2 and i <= searchResults.number + 2)}"
                        class="page-item" th:classappend="${searchResults.number == i} ? 'active'">
                        <a class="page-link" th:href="@{/vendors(page=${i}, size=${size}, sort=${sortBy})}" th:text="${i + 1}">1</a>
                    </li>
                    <!-- Ellipsis -->
                    <li th:if="${(i == 1 and searchResults.number > 3) or (i == searchResults.totalPages - 2 and searchResults.number < searchResults.totalPages - 4)}"
                        class="page-item disabled">
                        <span class="page-link">...</span>
                    </li>
                </th:block>

                <!-- Next -->
                <li class="page-item" th:classappend="${searchResults?.last} ? 'disabled'">
                    <a class="page-link mb-3" th:href="@{/vendors(page=${searchResults.number + 1}, size=${size}, sort=${sortBy})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>

    <div class="row justify-content-center">

        <div class="col-lg-10">
            <a th:href="@{/vendors/new}" class="btn btn-sm btn-outline-dark mb-2 ms-2" title="Add">Add</a>
        </div>

        <div class="col-md-6 col-lg-5" th:each="vendor : ${vendors}">

            <!-- This controls the card width -->
            <div class="card shadow-sm mt-2 mb-2 mx-2">
                <div class="card-header bg-black text-white">
                    <h5 class="mb-0">
                      <a th:href="@{/vendors/{acc}(acc=${vendor.accountNumber})}"
                        th:text="${vendor.contactName}">
                          class="text-white text-decoration-none">Vendor Name</a>
                    </h5>
                </div>
                <div class="card-body p-4">
                    <!-- FIX: Combined into ONE form so all inputs are submitted together -->
                    <form th:action="@{/vendors/update}" method="post"
                          onsubmit="return confirm('Are you sure you want to save changes?')">

                        <!-- FIX: Use name/th:value instead of th:field to avoid binding errors in loops -->
                        <input type="hidden" name="id" th:value="${vendor.id}" />

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Account Number</label>
                                <input type="number" name="accountNumber" class="form-control" th:value="${vendor.accountNumber}" readonly>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Address</label>
                                <input type="text" name="address" class="form-control" th:value="${vendor.address}"
                                       placeholder="1234 Main St">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Contact Name</label>
                                <input type="text" name="contactName" class="form-control" th:value="${vendor.contactName}">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Email Address</label>
                                <input type="text" name="emailAddress" class="form-control" th:value="${vendor.emailAddress}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone Number</label>
                                <input type="text" name="phoneNumber" class="form-control" th:value="${vendor.phoneNumber}">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Associated Products</label>
                                <div class="border rounded p-2 bg-light" style="max-height: 150px; overflow-y: auto;">
                                    <ul class="list-unstyled mb-0">
                                        <!-- Only show what is already assigned -->
                                        <li th:each="p : ${vendor.products}" class="small border-bottom pb-1 mb-1">
                                            <span th:text="${p.productName}">Product Name</span>
<!--                                            <a th:href="@{/vendors/{vId}/remove/{pId}(vId=${vendor.id}, pId=${p.id})}"-->
                                            <a th:href="@{/vendors/{id}/remove/{productId}(id=${vendor.id}, productId=${p.id})}"
                                               class="text-danger float-end" style="text-decoration:none;">&times;</a>
                                        </li>
                                        <li th:if="${#lists.isEmpty(vendor.products)}" class="text-muted small">
                                            No products are assigned.
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-dark me-2">Update</button>
                            <a th:href="@{/vendors/{acc}(acc=${vendor.accountNumber})}" class="btn btn-outline-secondary">View Details</a>
                            <!-- Delete form or link -->
                            <a th:href="@{/vendors/delete/{id}(id=${vendor.id})}"
                               class="btn btn-dark ms-2"
                               onclick="return confirm('Are you sure you want to delete this vendor?')">Delete</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
<div class="text-center" th:insert="fragments/footer :: inventory-footer"></div>
</body>
</html>
